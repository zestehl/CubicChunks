name: Cleanroom and Forge port

on:
  push:
    branches: ['riven/cleanroom-java25']
  pull_request:
    paths:
      - 'cleanroom/**'
      - 'src/**'
      - 'CubicChunksAPI/src/**'
      - '.github/workflows/cleanroom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [cleanroom, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run focused regressions
        working-directory: cleanroom
        run: bash gradlew -PcubicLoader=${{ matrix.loader }} build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: cubicchunks-${{ matrix.loader }}
          path: |
            cleanroom/build/${{ matrix.loader }}/libs/*
            cleanroom/build/${{ matrix.loader }}/reports/tests/
